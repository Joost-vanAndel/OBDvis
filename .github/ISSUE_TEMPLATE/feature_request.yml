name: Feature request
description: Suggest an improvement for OBDvis.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or UI you would expect.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bluetooth / ELM327 connection
        - Live dashboard
        - Vehicle health diagnostics
        - DTCs
        - Post-drive summary
        - Android Auto
        - Documentation
        - Build / maintenance
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention any simpler or related approaches.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or vehicle/adapter context if relevant. Avoid private data.
    validations:
      required: false
